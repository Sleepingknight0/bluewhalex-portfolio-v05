<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Universal AI CLI Launcher command console</title>
  <desc id="description">A monochrome concept illustration of a PowerShell command center selecting AI providers and isolated accounts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080a"/>
      <stop offset="1" stop-color="#171b1f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#d7dde2" stroke-width="2">
    <path d="M96 92H1344V808H96Z"/>
    <path d="M96 190H1344M96 724H1344" stroke-opacity=".55"/>
  </g>
  <g font-family="Consolas, 'Cascadia Mono', monospace" fill="#f4f7f9">
    <text x="136" y="146" font-size="28" letter-spacing="4">AI CLI // COMMAND NEXUS</text>
    <text x="1030" y="146" font-size="17" fill="#8f9ba5" letter-spacing="2">CACHE-ONLY HOT PATH</text>
    <text x="138" y="230" font-size="16" fill="#8f9ba5" letter-spacing="2">SYS</text>
    <text x="240" y="230" font-size="16" fill="#8f9ba5" letter-spacing="2">PROVIDER / ACCOUNT LINK</text>
    <text x="870" y="230" font-size="16" fill="#8f9ba5" letter-spacing="2">SANITIZED TELEMETRY</text>
  </g>
  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <g transform="translate(136 278)">
      <text x="0" y="26" font-size="23" fill="#f4f7f9">01</text>
      <text x="104" y="26" font-size="23" fill="#f4f7f9">CLAUDE / PERSONAL</text>
      <circle cx="744" cy="18" r="8" fill="#eef4f6" filter="url(#glow)"/>
      <g transform="translate(784 2)" fill="#eef4f6">
        <rect width="22" height="32" rx="2"/><rect x="30" width="22" height="32" rx="2"/><rect x="60" width="22" height="32" rx="2"/><rect x="90" width="22" height="32" rx="2"/><rect x="120" width="22" height="32" rx="2"/><rect x="150" width="22" height="32" rx="2"/>
        <g fill="#3a4249"><rect x="180" width="22" height="32" rx="2"/><rect x="210" width="22" height="32" rx="2"/><rect x="240" width="22" height="32" rx="2"/><rect x="270" width="22" height="32" rx="2"/></g>
      </g>
      <text x="1100" y="28" font-size="22" fill="#f4f7f9">064%</text>
    </g>
    <g transform="translate(136 388)">
      <text x="0" y="26" font-size="23" fill="#f4f7f9">02</text>
      <text x="104" y="26" font-size="23" fill="#f4f7f9">CODEX / WORK</text>
      <circle cx="744" cy="18" r="8" fill="#aeb8bf"/>
      <g transform="translate(784 2)" fill="#eef4f6">
        <rect width="22" height="32" rx="2"/><rect x="30" width="22" height="32" rx="2"/><rect x="60" width="22" height="32" rx="2"/><rect x="90" width="22" height="32" rx="2"/><rect x="120" width="22" height="32" rx="2"/>
        <g fill="#3a4249"><rect x="150" width="22" height="32" rx="2"/><rect x="180" width="22" height="32" rx="2"/><rect x="210" width="22" height="32" rx="2"/><rect x="240" width="22" height="32" rx="2"/><rect x="270" width="22" height="32" rx="2"/></g>
      </g>
      <text x="1100" y="28" font-size="22" fill="#d6dde2">053%</text>
      <text x="1182" y="28" font-size="15" fill="#8f9ba5">STALE</text>
    </g>
    <g transform="translate(136 498)">
      <text x="0" y="26" font-size="23" fill="#f4f7f9">03</text>
      <text x="104" y="26" font-size="23" fill="#f4f7f9">GROK / DEFAULT</text>
      <circle cx="744" cy="18" r="8" fill="none" stroke="#69747c" stroke-width="3"/>
      <text x="784" y="27" font-size="20" fill="#8f9ba5" letter-spacing="2">NO SAFE TELEMETRY SOURCE</text>
    </g>
    <g transform="translate(136 608)">
      <text x="0" y="26" font-size="23" fill="#f4f7f9">04</text>
      <text x="104" y="26" font-size="23" fill="#f4f7f9">ANTIGRAVITY / SYSTEM</text>
      <circle cx="744" cy="18" r="8" fill="none" stroke="#69747c" stroke-width="3"/>
      <text x="784" y="27" font-size="20" fill="#8f9ba5" letter-spacing="2">SYSTEM-DEFAULT ACCOUNT</text>
    </g>
    <text x="136" y="772" font-size="18" fill="#8f9ba5" letter-spacing="2">[L] LAST LINK</text>
    <text x="390" y="772" font-size="18" fill="#8f9ba5" letter-spacing="2">[M] MANAGE</text>
    <text x="600" y="772" font-size="18" fill="#8f9ba5" letter-spacing="2">[D] DIAGNOSTIC</text>
    <text x="880" y="772" font-size="18" fill="#8f9ba5" letter-spacing="2">[Q] EXIT</text>
  </g>
</svg>
